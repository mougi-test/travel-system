# Ажиллуулах: docker compose up -d --build
# Нууц утгууд (POSTGRES_PASSWORD, JWT_SECRET, EC2_IP) энэ хавтасны .env файлаас уншигдана.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: student
      POSTGRES_DB: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env-д алга}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL .env-д алга}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD .env-д алга}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Сан хоосон үед (анх асахад) л автоматаар ачаална
      - ./synthetic_data.sql:/docker-entrypoint-initdb.d/01_synthetic_data.sql:ro
      - ./db-init/02_admin.sh:/docker-entrypoint-initdb.d/02_admin.sh:ro
    # ports: байхгүй — зөвхөн дотоод сүлжээнд, гадагш нээгдэхгүй
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d travel"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./travel-backend
    environment:
      DATABASE_URL: postgresql://student:${POSTGRES_PASSWORD}@db:5432/travel
      ALLOWED_ORIGINS: http://${EC2_IP:?EC2_IP .env-д алга}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env-д алга}
      JWT_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./travel-frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
